# Zero-budget portfolio configuration. Keep both provider accounts on Free.
services:
  - type: web
    name: orderops-python
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py --host 0.0.0.0
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: PUBLIC_DEMO
        value: "1"
      - key: DEMO_WORKSPACES
        value: /tmp/orderops-runtime
      - key: REQUIRE_DATABASE
        value: "1"
      - key: DATABASE_URL
        sync: false
